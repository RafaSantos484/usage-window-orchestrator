# Manual minimal invocation against the Claude subscription.
#
# The canonical repository deliberately has no schedule. Consumers may add a
# schedule of their choosing to this provider-specific workflow in their own
# repository; see docs/scheduling.md. Keeping one workflow per provider makes
# selection deterministic and keeps each provider's secret out of the other's
# job entirely. Codex lives in usage-window-trigger-codex.yml.
# Rationale: docs/adr/0002-codex-provider.md and 0003-consumer-owned-scheduling.md.
name: Provider invocation (Claude)

on:
  # Consumer scheduling activation point: add `schedule` in your own repository.
  # See docs/scheduling.md; no recurring invocation is enabled upstream.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate configuration without calling the provider (consumes no allowance)"
        type: boolean
        default: false
      model:
        description: "Model override (blank = repository default)"
        type: string
        default: ""
      log_level:
        description: "Log level"
        type: choice
        options: [debug, info, warn, error]
        default: info

# Least privilege: the job reads the repository and writes nothing back.
permissions:
  contents: read

# Overlap protection. One in-flight Claude run; a newcomer queues rather than
# cancelling, because cancelling mid-invocation could leave allowance spent.
# Codex uses a separate group: overlap protection is scoped per provider by
# default, and cross-provider exclusion can be configured if required.
concurrency:
  group: usage-window-trigger-claude
  cancel-in-progress: false

jobs:
  trigger:
    # The provider Environment's deployment-branch policy is the secret
    # boundary. This in-file guard and the checkout below are defense in depth.
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    environment: usage-window-claude
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install the Claude Code CLI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # Reviewed exact package/version. Upgrade this literal through a
        # reviewed change after validating the adapter against the new CLI
        # output contract.
        run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@2.1.268"

      - name: Invoke Claude
        id: trigger
        env:
          # The only credential in this job. Never echoed, never forwarded to
          # anything but the provider adapter's child process.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Inputs are passed through the environment rather than interpolated
          # into the shell, so no input value can be parsed as a command.
          AGENT_PROVIDER: claude
          AGENT_MODEL: ${{ github.event.inputs.model || vars.AGENT_MODEL }}
          AGENT_PROMPT: ${{ vars.AGENT_PROMPT }}
          AGENT_TIMEOUT_SECONDS: ${{ vars.AGENT_TIMEOUT_SECONDS }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS }}
          AGENT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          AGENT_LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
          AGENT_TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: |
          set -o pipefail
          set +e
          node src/main.ts
          echo "process_exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Classify outcome
        if: always()
        uses: ./.github/actions/classify-outcome
        with:
          exit-code: ${{ steps.trigger.outputs.process_exit_code }}
          provider-label: Claude
          credential-name: CLAUDE_CODE_OAUTH_TOKEN
